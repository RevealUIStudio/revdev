name: Verified third-party attribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.13.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/console/go.mod
          cache-dependency-path: apps/console/go.sum
      # pnpm 10.12.1 --force installs platform-incompatible optional packages.
      # They remain in production attribution even on the Linux gate runner.
      # No lifecycle scripts are needed to inspect licenses and copyright files.
      - name: Install complete locked Node attribution inventory
        run: pnpm install --frozen-lockfile --force --ignore-scripts
      - name: Provision pinned attribution tools in the maintained workspace location
        run: pnpm notice:prepare-tools
      - name: Generate verified attribution artifact for review
        run: pnpm notice:generate
      - name: Verify complete attribution and deterministic regeneration
        run: pnpm notice:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: NOTICE.md
          if-no-files-found: error
