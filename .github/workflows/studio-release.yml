name: Studio Release

on:
  push:
    tags:
      - "studio-v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Generate ts-rs bindings
        shell: bash
        run: bash apps/studio/scripts/generate-types.sh

      - name: Build workspace deps (@revdev/protocol)
        # studio's typecheck imports @revdev/protocol (RPC_METHODS contract
        # test); repo CI builds it before typecheck, this workflow must too.
        run: pnpm --filter @revdev/protocol build


      - name: Build Studio (Tauri)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS ships ad-hoc/unsigned until Apple Developer ID + notarization are provisioned (tracked internally).
          # With APPLE_* absent, tauri's bundler skips code-signing (keychain -> None) and produces an unsigned
          # .app/.dmg; passing an invalid/unprovisioned APPLE_CERTIFICATE instead hard-fails the bundle at `security
          # import`. Restore the 6 APPLE_* secrets here once a real Developer ID cert lands. Same unsigned posture as
          # Windows (SmartScreen). Does NOT touch TAURI_SIGNING_* (updater key, workflow env above) or license signing.
        with:
          projectPath: apps/studio
          tauriScript: pnpm tauri
          args: --target ${{ matrix.rust_target }}
          tagName: ${{ github.ref_name }}
          releaseName: "RevealUI Studio ${{ github.ref_name }}"
          releaseBody: "See the [changelog](https://github.com/RevealUIStudio/revdev/blob/main/CHANGELOG.md) for details."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          includeUpdaterJson: true

  # Stable updater feed. Shipped binaries also try releases.revealui.com first;
  # this GitHub release is the durable fallback and the source that domain should
  # mirror. Tag is rolling (assets only) so /releases/latest can stay a version tag.
  publish-updater:
    needs: build
    if: github.event_name == 'push' || inputs.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish latest.json to studio-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release download "$tag" -R RevealUIStudio/revdev -p 'latest.json' -p 'latest*.json'
          test -f latest.json
          if ! gh release view studio-latest -R RevealUIStudio/revdev >/dev/null 2>&1; then
            gh release create studio-latest -R RevealUIStudio/revdev \
              --title "Studio updater feed" \
              --notes "Rolling Tauri updater manifest. Install a studio-v* release, not this tag."
          fi
          gh release upload studio-latest latest.json -R RevealUIStudio/revdev --clobber
