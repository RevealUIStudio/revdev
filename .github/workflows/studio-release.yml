name: Studio Release

on:
  push:
    tags:
      - "studio-v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  # Updater minisign key. OS code-signing secrets are forwarded per platform
  # below, and only when non-empty — an empty APPLE_CERTIFICATE is still
  # "set" to Tauri and fails at `security import`.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  linux-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build WSL revdev-relay
        run: cargo build --release --manifest-path apps/studio/relay/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: revdev-relay
          path: apps/studio/relay/target/release/revdev-relay

  build:
    needs: linux-relay
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: revdev-relay
          path: apps/studio/src-tauri/wsl
      - name: Mark relay executable
        if: matrix.platform != 'windows-latest'
        run: chmod +x apps/studio/src-tauri/wsl/revdev-relay

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Generate ts-rs bindings
        shell: bash
        run: bash apps/studio/scripts/generate-types.sh

      - name: Build workspace deps (@revdev/protocol)
        # studio's typecheck imports @revdev/protocol (RPC_METHODS contract
        # test); repo CI builds it before typecheck, this workflow must too.
        run: pnpm --filter @revdev/protocol build


      # Names only. Certificate bytes come from Actions secrets the owner sets.
      # This step does not generate or decode a certificate; it publishes
      # non-empty values for the Tauri bundler (APPLE_CERTIFICATE import +
      # notarization). An empty APPLE_CERTIFICATE leaves the build unsigned.
      - name: Forward macOS code-signing secrets
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            if [ -n "${APPLE_CERTIFICATE_PASSWORD}" ]; then
              echo "APPLE_CERTIFICATE_PASSWORD is set but APPLE_CERTIFICATE is empty" >&2
              exit 1
            fi
            echo "codesign: APPLE_CERTIFICATE unset; macOS build stays unsigned"
            exit 0
          fi
          missing=()
          require() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              missing+=("$name")
            fi
          }
          require APPLE_CERTIFICATE_PASSWORD "${APPLE_CERTIFICATE_PASSWORD}"
          require APPLE_ID "${APPLE_ID}"
          require APPLE_PASSWORD "${APPLE_PASSWORD}"
          require APPLE_TEAM_ID "${APPLE_TEAM_ID}"
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "APPLE_CERTIFICATE is set but these secrets are empty: ${missing[*]}" >&2
            exit 1
          fi
          publish() {
            local name="$1"
            local value="$2"
            local delim
            delim="EOS_$(openssl rand -hex 16)"
            {
              printf '%s<<%s\n' "$name" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
            echo "codesign: forwarded ${name}"
          }
          publish APPLE_CERTIFICATE "${APPLE_CERTIFICATE}"
          publish APPLE_CERTIFICATE_PASSWORD "${APPLE_CERTIFICATE_PASSWORD}"
          publish APPLE_ID "${APPLE_ID}"
          publish APPLE_PASSWORD "${APPLE_PASSWORD}"
          publish APPLE_TEAM_ID "${APPLE_TEAM_ID}"
          if [ -n "${APPLE_SIGNING_IDENTITY}" ]; then
            publish APPLE_SIGNING_IDENTITY "${APPLE_SIGNING_IDENTITY}"
          else
            echo "codesign: APPLE_SIGNING_IDENTITY unset; Tauri uses the identity inside the certificate"
          fi

      # Names only. Decode the owner-provided .pfx, import it into the job
      # certificate store, and pass the thumbprint read from that certificate
      # to Tauri. The thumbprint is not stored in the repo.
      - name: Import Windows code-signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          # certutil writes status on stderr; do not treat that as a terminating error.
          $PSNativeCommandUseErrorActionPreference = $false
          $cert = $env:WINDOWS_CERTIFICATE
          $password = $env:WINDOWS_CERTIFICATE_PASSWORD
          $certSet = -not [string]::IsNullOrWhiteSpace($cert)
          $passwordSet = -not [string]::IsNullOrWhiteSpace($password)
          if (-not $certSet -and -not $passwordSet) {
            Write-Host "codesign: WINDOWS_CERTIFICATE unset; Windows build stays unsigned"
            exit 0
          }
          if (-not $certSet -or -not $passwordSet) {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must both be set"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "studio-windows-certificate.pfx"
          $b64 = Join-Path $env:RUNNER_TEMP "studio-windows-certificate.b64.txt"
          try {
            $raw = $cert.Trim()
            if ($raw -match '-----BEGIN') {
              [System.IO.File]::WriteAllText($b64, $raw)
              & certutil -decode $b64 $pfx | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "certutil -decode failed for WINDOWS_CERTIFICATE" }
            } else {
              $bytes = [Convert]::FromBase64String(($raw -replace '\s', ''))
              [System.IO.File]::WriteAllBytes($pfx, $bytes)
            }
            $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
            $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure)
            $leaf = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if (-not $leaf) {
              throw "WINDOWS_CERTIFICATE imported but no certificate with a private key was found"
            }
            $thumb = ($leaf.Thumbprint -replace '\s', '').ToUpperInvariant()
            if ($thumb -notmatch '^[0-9A-F]+$') {
              throw "imported certificate thumbprint is not hex"
            }
            $configPath = (Join-Path $env:RUNNER_TEMP "windows-sign.json") -replace '\\', '/'
            $json = '{"bundle":{"windows":{"certificateThumbprint":"' + $thumb + '","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.comodoca.com"}}}'
            [System.IO.File]::WriteAllText($configPath, $json)
            Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_SIGN_ARGS=--config $configPath"
            Write-Host "codesign: imported Windows certificate thumbprint $thumb"
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx, $b64
          }

      - name: Build Studio (Tauri)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_* arrives via GITHUB_ENV from the forward step when those
          # secrets are non-empty. WINDOWS_SIGN_ARGS is set only after a real
          # WINDOWS_CERTIFICATE import. Neither path embeds certificate bytes.
          # Does not touch TAURI_SIGNING_* (updater key, workflow env above).
        with:
          projectPath: apps/studio
          tauriScript: pnpm tauri
          args: --target ${{ matrix.rust_target }} ${{ env.WINDOWS_SIGN_ARGS }}
          tagName: ${{ github.ref_name }}
          releaseName: "RevDev ${{ github.ref_name }}"
          releaseBody: "See the [changelog](https://github.com/RevealUIStudio/revdev/blob/main/CHANGELOG.md) for details."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          includeUpdaterJson: true

  # Stable updater feed. Shipped binaries also try releases.revealui.com first;
  # this GitHub release is the durable fallback and the source that domain should
  # mirror. Tag is rolling (assets only) so /releases/latest can stay a version tag.
  publish-updater:
    needs: build
    if: github.event_name == 'push' || inputs.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish latest.json to studio-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release download "$tag" -R RevealUIStudio/revdev -p 'latest.json' -p 'latest*.json'
          test -f latest.json
          if ! gh release view studio-latest -R RevealUIStudio/revdev >/dev/null 2>&1; then
            gh release create studio-latest -R RevealUIStudio/revdev \
              --title "Studio updater feed" \
              --notes "Rolling Tauri updater manifest. Install a studio-v* release, not this tag."
          fi
          gh release upload studio-latest latest.json -R RevealUIStudio/revdev --clobber
