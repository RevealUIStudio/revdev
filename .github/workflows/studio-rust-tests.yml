name: Studio Rust Tests

# Integration tests for the Tauri-side Rust code (harness JSON-RPC client +
# daemon_ctl lifecycle) against a REAL node daemon. Path-filtered: compiling
# the studio_lib crate (tauri + vendored libgit2/openssl) is heavy, so this
# only runs when the Rust surface or the daemon it talks to changes.
#
# NOT a required check (path-filtered workflows report SKIPPED on unrelated
# PRs, and SKIPPED blocks merges when a check is required).

on:
  push:
    branches: [main, test]
    paths:
      - "apps/studio/src-tauri/**"
      - "apps/studio/relay/**"
      - "packages/daemon/**"
      - "packages/protocol/**"
      - ".github/workflows/studio-rust-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [main, test]
    paths:
      - "apps/studio/src-tauri/**"
      - "apps/studio/relay/**"
      - "packages/daemon/**"
      - "packages/protocol/**"
      - ".github/workflows/studio-rust-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  rust-integration:
    name: Rust Integration (bridge <-> daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/studio/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Build daemon (tests spawn packages/daemon/dist/cli.js)
        run: |
          pnpm --filter @revdev/protocol build
          pnpm --filter @revdev/daemon build

      # tauri-build's codegen requires the configured frontendDist path to
      # exist; the Rust tests never load the frontend, so an empty dir is
      # enough (mirrors what tauri-action gets from beforeBuildCommand).
      - name: Satisfy tauri-build frontendDist
        run: mkdir -p apps/studio/dist

      # --test-threads=1: both test binaries route the harness client through
      # process-global env (REVDEV_TEST_SOCKET / REVDEV_DAEMON_*); parallel
      # tests would race each other's socket overrides.
      - name: Run Rust integration tests
        run: |
          cargo test \
            --manifest-path apps/studio/src-tauri/Cargo.toml \
            --test harness_integration \
            --test daemon_ctl_integration \
            --test ssh_output_pump \
            -- --test-threads=1

  relay:
    name: Relay (AF_UNIX <-> stdio bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/studio/relay -> target

      # The relay is a zero-dependency std-only binary (no tauri / system libs),
      # so it builds + tests in isolation. Bidirectional-bridge integration
      # tests drive the real built binary against a mock socket.
      - name: Build + test the WSL relay
        run: cargo test --manifest-path apps/studio/relay/Cargo.toml --release
