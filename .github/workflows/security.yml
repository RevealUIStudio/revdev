name: Security

# Ports the portable jobs from RevealUI's Security workflow:
#   gitleaks       — full-history secret scanning
#   codeql         — TypeScript + Go static analysis (Rust uses clippy in ci.yml)
#   dependency-review — blocks PRs that introduce high-severity CVEs
#
# The revealui-specific `security-gate` job (which runs `pnpm gate:security`)
# is not ported because its underlying scripts live in the revealui repo.

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  schedule:
    - cron: '0 9 * * 1' # weekly Monday 9 AM UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, go]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # JS/TS-specific setup: install deps so CodeQL sees the full module graph
      # (pnpm version sourced from package.json "packageManager" field; don't set
      # `version:` here — pnpm/action-setup@v4 rejects the combination since
      # late 2026 with ERR_PNPM_BAD_PM_VERSION)
      - if: matrix.language == 'javascript-typescript'
        uses: pnpm/action-setup@v4

      - if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - if: matrix.language == 'javascript-typescript'
        run: pnpm install --frozen-lockfile

      # Go-specific setup
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/terminal/go.sum

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
