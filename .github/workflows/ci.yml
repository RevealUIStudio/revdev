name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  typecheck-studio:
    name: Typecheck (studio)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Linux system dependencies (Tauri toolchain for ts-rs binding generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/studio/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # Studio frontend build imports ./generated/* (ts-rs bindings, gitignored),
      # so regenerate them from the Rust source first. `build` runs `tsc -b` (the
      # #143 failure mode) then `vite build`, mirroring build-windows.ps1's frontend
      # step, catching type errors AND bundling errors on every PR.
      - run: bash apps/studio/scripts/generate-types.sh
      - run: pnpm --filter studio build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  prove-red:
    name: Prove-Red (changed tests must fail against base)
    runs-on: ubuntu-latest
    needs: quality
    # PR-only: a merge-base is meaningless on a direct push to test/main.
    if: github.event_name == 'pull_request'
    steps:
      # Check out the PR head (not the synthetic merge commit) with full history
      # so scripts/ci/prove-red.mjs can compute the merge base and revert the
      # source diff. See docs (verification-enforcement lane) for the mechanism.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Changed daemon tests import @revdev/protocol and @revdev/daemon; build
      # them from source first, exactly as the root `test` script does, or the
      # per-file vitest runs fail to resolve imports rather than on assertions.
      - run: pnpm --filter @revdev/protocol build
      - run: pnpm --filter @revdev/daemon build
      - name: Prove changed tests are red against base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/prove-red.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Studio build requires cargo for ts-rs bindings; it lives in studio-release.yml.
      - run: pnpm -r --filter=!studio build

  console:
    name: Console (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/console/go.mod
          cache-dependency-path: apps/console/go.sum
      - run: cd apps/console && go test ./...
      - run: cd apps/console && go build -o /dev/null .

  private-leak-scan:
    name: Private Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Scan for private paths and credentials
        run: bash scripts/check-no-private-leaks.sh

  zero-9p-fence:
    name: Zero-9P Fence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      # Fails if Studio's file/git command modules reintroduce direct ext4 / git
      # access — all I/O must route through the WSL daemon (ADR P5). No deps.
      - name: Zero-9P regression fence
        run: node scripts/check-zero-9p-fence.mjs

  docs-accuracy:
    name: Docs Accuracy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      # Zero-dependency lint (no pnpm install needed): fails if docs present a
      # rejected legacy license format (RVUI.v2.* / RVUI-*) as if usable.
      - name: License-format doc-lint
        run: node scripts/doc-lint-license-format.mjs
