# cargo-about configuration for third-party license auditing.
# Run: cargo about generate about.hbs
# Docs: https://github.com/EmbarkStudios/cargo-about

# Licenses accepted for use in this commercial product.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "OpenSSL",
  "MPL-2.0",
]

# Unknown or missing attribution fails through the maintained generator and cargo-about --fail.

# These local commercial workspace crates are not third-party dependencies.
# Cargo-about ignores only unpublished workspace members; registry/git crates
# still require their accepted license and original source attribution.
private = { ignore = true }

# Workarounds for crates with non-standard license fields
# Add exceptions here as needed:
# [[clarify.ring]]
# expression = "ISC AND MIT AND OpenSSL"
